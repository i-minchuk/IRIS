<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chrome Character</title>
<style>
  /* ========== Manrope Font ========== */
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggqxSuXd.woff2) format('woff2');
    unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;
  }
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggOxSuXd.woff2) format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggSxSuXd.woff2) format('woff2');
    unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;
  }
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggixSuXd.woff2) format('woff2');
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggmxSuXd.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'Manrope';
    font-style: normal;
    font-weight: 200 800;
    font-display: swap;
    src: url(https://fonts.gstatic.com/s/manrope/v20/xn7gYHE41ni1AdIRggexSg.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Manrope', sans-serif;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 500px;
    height: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* ========== Floating Animation (Active & Smooth) ========== */
  @keyframes float {
    0%, 100% {
      transform: translateY(0px) rotate(0deg);
    }
    25% {
      transform: translateY(-25px) rotate(-2deg);
    }
    50% {
      transform: translateY(-35px) rotate(0deg);
    }
    75% {
      transform: translateY(-15px) rotate(2deg);
    }
  }

  @keyframes shadowPulse {
    0%, 100% {
      transform: scaleX(1);
      opacity: 0.4;
    }
    25% {
      transform: scaleX(0.85);
      opacity: 0.25;
    }
    50% {
      transform: scaleX(0.75);
      opacity: 0.2;
    }
    75% {
      transform: scaleX(0.9);
      opacity: 0.3;
    }
  }

  .character-wrapper {
    animation: float 4s ease-in-out infinite;
    transform-origin: center bottom;
  }

  .shadow {
    animation: shadowPulse 4s ease-in-out infinite;
  }

  /* ========== Eye Blinking Animation ========== */
  @keyframes blinkLeft {
    0%, 48%, 52%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.1); }
  }

  @keyframes blinkRight {
    0%, 58%, 62%, 100% { transform: scaleY(1); }
    60% { transform: scaleY(0.1); }
  }

  .eye-left {
    animation: blinkLeft 4s ease-in-out infinite;
    transform-origin: 215px 235px;
  }

  .eye-right {
    animation: blinkRight 4s ease-in-out infinite;
    transform-origin: 285px 235px;
  }

  /* ========== Smile Animation ========== */
  .smile {
    animation: smilePath 4s ease-in-out infinite;
  }

  @keyframes smilePath {
    0%, 100% {
      d: path('M 235 270 Q 250 280 265 270');
    }
    50% {
      d: path('M 230 268 Q 250 295 270 268');
    }
  }

  /* ========== Glow Pulse ========== */
  @keyframes glow {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .glow-highlight {
    animation: glow 3s ease-in-out infinite;
  }

  /* ========== Sparkle Animation ========== */
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1); }
  }

  .sparkle {
    animation: sparkle 2.5s ease-in-out infinite;
  }

  .sparkle-2 {
    animation-delay: 0.8s;
  }

  .sparkle-3 {
    animation-delay: 1.5s;
  }

  /* ========== Text ========== */
  .label {
    margin-top: 30px;
    color: #888;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.6;
  }
</style>
</head>
<body>

<div class="scene">
  <!-- Ground shadow -->
  <svg width="400" height="400" viewBox="0 0 400 400" style="position:absolute; bottom:40px;">
    <defs>
      <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000" stop-opacity="0.8"/>
        <stop offset="50%" stop-color="#000" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <ellipse class="shadow" cx="200" cy="360" rx="70" ry="12" fill="url(#shadowGrad)"/>
  </svg>

  <!-- Character SVG -->
  <svg class="character-wrapper" width="400" height="400" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Chrome body gradient -->
      <radialGradient id="chromeBody" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="15%" stop-color="#e8e8e8"/>
        <stop offset="35%" stop-color="#b0b0b0"/>
        <stop offset="55%" stop-color="#606060"/>
        <stop offset="75%" stop-color="#2a2a2a"/>
        <stop offset="90%" stop-color="#0f0f0f"/>
        <stop offset="100%" stop-color="#050505"/>
      </radialGradient>

      <!-- Inner notch gradient -->
      <radialGradient id="notchInner" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#1a1a1a"/>
        <stop offset="40%" stop-color="#0a0a0a"/>
        <stop offset="100%" stop-color="#000000"/>
      </radialGradient>

      <!-- Highlight reflection -->
      <linearGradient id="highlight" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="30%" stop-color="#ffffff" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>

      <!-- Rim light -->
      <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#88bbff" stop-opacity="0.6"/>
        <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#88bbff" stop-opacity="0.6"/>
      </linearGradient>

      <!-- Eye gradient -->
      <radialGradient id="eyeGrad" cx="40%" cy="30%" r="60%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="60%" stop-color="#aaccff"/>
        <stop offset="100%" stop-color="#5577aa"/>
      </radialGradient>
    </defs>

    <!-- ========== BODY ========== -->
    <!-- Main chrome sphere body -->
    <circle cx="250" cy="250" r="110" fill="url(#chromeBody)"/>

    <!-- ========== NOTCH (top cutout) ========== -->
    <!-- Dark inner notch -->
    <path d="M 185 200 
             Q 185 140 250 140 
             Q 315 140 315 200
             Q 315 175 250 175
             Q 185 175 185 200 Z" 
          fill="url(#notchInner)"/>

    <!-- Notch rim highlight -->
    <path d="M 185 200 
             Q 185 140 250 140 
             Q 315 140 315 200" 
          fill="none" stroke="url(#rimLight)" stroke-width="3" stroke-linecap="round"/>

    <!-- Inner notch edge glow -->
    <path d="M 188 198 
             Q 188 175 250 175 
             Q 312 175 312 198" 
          fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>

    <!-- ========== CHROME REFLECTIONS ========== -->
    <!-- Top-left bright highlight -->
    <ellipse class="glow-highlight" cx="210" cy="190" rx="25" ry="18" fill="url(#highlight)" opacity="0.9"/>

    <!-- Mid horizontal reflection line -->
    <rect class="glow-highlight" x="230" y="245" width="40" height="4" rx="2" fill="#ffffff" opacity="0.85"/>

    <!-- Bottom edge reflection -->
    <path d="M 170 320 Q 250 345 330 320" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" stroke-linecap="round"/>

    <!-- Side rim reflections -->
    <path d="M 148 220 Q 140 250 148 280" fill="none" stroke="#88bbff" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round"/>
    <path d="M 352 220 Q 360 250 352 280" fill="none" stroke="#88bbff" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- ========== FACE (cute kawaii features) ========== -->
    <!-- Left eye -->
    <g class="eye-left">
      <!-- Eye outline -->
      <ellipse cx="215" cy="235" rx="16" ry="18" fill="#223355"/>
      <!-- Eye fill -->
      <ellipse cx="215" cy="235" rx="14" ry="16" fill="url(#eyeGrad)"/>
      <!-- Eye highlight -->
      <ellipse cx="210" cy="229" rx="5.5" ry="6.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="219" cy="241" r="3" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Right eye -->
    <g class="eye-right">
      <!-- Eye outline -->
      <ellipse cx="285" cy="235" rx="16" ry="18" fill="#223355"/>
      <!-- Eye fill -->
      <ellipse cx="285" cy="235" rx="14" ry="16" fill="url(#eyeGrad)"/>
      <!-- Eye highlight -->
      <ellipse cx="280" cy="229" rx="5.5" ry="6.5" fill="#ffffff" opacity="0.95"/>
      <circle cx="289" cy="241" r="3" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Cute smile -->
    <path class="smile" d="M 235 270 Q 250 282 265 270" fill="none" stroke="#334477" stroke-width="3" stroke-linecap="round"/>

    <!-- Tiny blush marks -->
    <ellipse cx="195" cy="255" rx="10" ry="6" fill="#ff88aa" opacity="0.15"/>
    <ellipse cx="305" cy="255" rx="10" ry="6" fill="#ff88aa" opacity="0.15"/>

    <!-- ========== SPARKLES ========== -->
    <!-- Sparkle 1 -->
    <g class="sparkle" transform="translate(140, 160)">
      <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#ffffff" opacity="0.8"/>
    </g>
    <!-- Sparkle 2 -->
    <g class="sparkle sparkle-2" transform="translate(360, 180)">
      <path d="M 0 -8 Q 0 0 8 0 Q 0 0 0 8 Q 0 0 -8 0 Q 0 0 0 -8 Z" fill="#ffffff" opacity="0.7"/>
    </g>
    <!-- Sparkle 3 -->
    <g class="sparkle sparkle-3" transform="translate(130, 300)">
      <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#88bbff" opacity="0.6"/>
    </g>
    <!-- Sparkle 4 -->
    <g class="sparkle" transform="translate(370, 280)">
      <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7 Z" fill="#ffffff" opacity="0.5"/>
    </g>
  </svg>

  <div class="label">Chrome Bot</div>
</div>

</body>
</html>
