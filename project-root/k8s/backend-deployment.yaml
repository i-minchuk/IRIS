apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dokpotok
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: iris-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: dokpotok-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: dokpotok-secrets
              key: SECRET_KEY
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: dokpotok-secrets
              key: OPENAI_API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dokpotok
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
