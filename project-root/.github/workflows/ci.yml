name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Backend: fast unit tests (SQLite, mocked)
  # ─────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-xdist

      - name: Run backend tests (parallel + coverage)
        working-directory: ./backend
        env:
          SECRET_KEY: test-secret-key-for-ci-purposes-only-min-32-chars
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          OPENAI_API_KEY: sk-dummy-key-for-ci-only-not-used-in-tests
        run: |
          pytest tests/ -v -n auto --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────
  # Backend: integration tests (PostgreSQL)
  # ─────────────────────────────────────────────
  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: iris
          POSTGRES_PASSWORD: iris
          POSTGRES_DB: iris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify Alembic migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://iris:iris@localhost:5432/iris_test
          SECRET_KEY: test-secret-key-for-ci-purposes-only-min-32-chars
        run: alembic upgrade head

      - name: Run integration tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://iris:iris@localhost:5432/iris_test
          SECRET_KEY: test-secret-key-for-ci-purposes-only-min-32-chars
          OPENAI_API_KEY: sk-dummy-key-for-ci-only-not-used-in-tests
        run: pytest tests/ -v -m integration

  # ─────────────────────────────────────────────
  # Frontend: build + type-check
  # ─────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        run: npm run build

  # ─────────────────────────────────────────────
  # Frontend: E2E tests (Playwright)
  # ─────────────────────────────────────────────
  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Set up Python (for backend dev server)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend & run E2E tests
        working-directory: ./frontend
        env:
          SECRET_KEY: test-secret-key-for-ci-purposes-only-min-32-chars
          DATABASE_URL: sqlite+aiosqlite:///./test_e2e.db
          OPENAI_API_KEY: sk-dummy-key-for-ci-only-not-used-in-tests
        run: |
          # Start backend in background
          cd ../backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          BACKEND_PID=$!
          sleep 5

          # Run E2E tests against running backend
          cd ../frontend
          npx playwright test --project=chromium

          # Cleanup
          kill $BACKEND_PID || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Security audit
  # ─────────────────────────────────────────────
  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-audit
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Check backend dependencies
        working-directory: ./backend
        run: pip-audit -r requirements.txt

      - name: Check frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=moderate

  # ─────────────────────────────────────────────
  # Architecture check
  # ─────────────────────────────────────────────
  architecture-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run architecture tests
        working-directory: ./backend
        env:
          SECRET_KEY: test-secret-key-for-ci-purposes-only-min-32-chars
        run: |
          pytest tests/test_architecture.py -v
          python scripts/check_architecture.py
